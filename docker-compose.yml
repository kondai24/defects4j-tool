services:
  defects4j:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defects4j-container
    environment:
      - TZ=America/Los_Angeles
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
    # FIX_PROVIDER / ANTHROPIC_API_KEY / OPENAI_API_KEY（.env.example を参照）
    env_file:
      - path: .env
        required: false
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    mem_limit: 6g
    memswap_limit: 6g
